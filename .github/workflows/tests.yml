name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run scheduler unit tests
        run: python -m unittest discover -s tests -p test_scheduler.py -v
      - name: Run messaging unit tests
        run: python -m unittest discover -s tests -p test_messaging.py -v
      - name: Run tmux utility unit tests
        run: python -m unittest discover -s tests -p test_tmux_utils.py -v

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install tmux
        run: |
          sudo apt-get update
          sudo apt-get install -y tmux
      - name: Run tmux integration tests
        run: python -m unittest discover -s tests -p test_integration_tmux.py -v

  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check shell syntax
        run: bash -n send-claude-message.sh schedule_with_note.sh
      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
      - name: Run ShellCheck
        run: shellcheck send-claude-message.sh schedule_with_note.sh
